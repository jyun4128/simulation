<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자율주행 초음파 혼선 방지 시뮬레이션 (Random Delay 방식)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            width: 1000px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* 도로 및 차량 애니메이션 영역 */
        .road-environment {
            width: 100%;
            height: 160px;
            background: #334155;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            border-bottom: 4px dashed #64748b;
            border-top: 4px dashed #64748b;
        }

        .car {
            width: 120px;
            height: 60px;
            border-radius: 8px;
            position: absolute;
            top: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .car-a {
            background-color: #0284c7; /* 앞차 */
            left: 550px;
        }

        .car-b {
            background-color: #047857; /* 뒷차 */
            left: 150px;
        }

        .sensor-label {
            font-size: 10px;
            opacity: 0.9;
            margin-top: 2px;
        }

        /* 파동 애니메이션 효과 */
        .wave {
            position: absolute;
            top: 80px;
            height: 2px;
            background: transparent;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes wave-expand-left {
            0% { width: 0; left: 550px; border-left: 4px solid var(--accent-blue); opacity: 1; }
            100% { width: 400px; left: 150px; border-left: 20px solid transparent; opacity: 0; }
        }

        @keyframes wave-expand-right {
            0% { width: 0; left: 270px; border-right: 4px solid var(--accent-green); opacity: 1; }
            100% { width: 400px; left: 270px; border-right: 20px solid transparent; opacity: 0; }
        }

        .wave-a-active { animation: wave-expand-left 0.6s linear forwards; }
        .wave-b-active { animation: wave-expand-right 0.6s linear forwards; }

        /* 간섭 경고 표시 */
        .crosstalk-alert {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: none;
        }

        /* 상태 판넬 및 컨트롤 */
        .panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .status-box {
            background: rgba(15, 23, 42, 0.4);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #475569;
        }

        .status-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .status-value {
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background: #2563eb; }
        button.stop { background: #ef4444; }
        button.stop:hover { background: #dc2626; }

        /* 그래프 스크롤 영역 */
        .graph-container {
            width: 100%;
            height: 180px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .graph-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(51, 65, 85, 0.3) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(51, 65, 85, 0.3) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .graph-line-desc {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 11px;
            display: flex;
            gap: 15px;
            background: rgba(15, 23, 42, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .desc-item span {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 4px;
            border-radius: 2px;
        }

        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            bottom: 0;
        }
    </style>
</head>
<body>

    <h1>자율주행 차량 간 초음파 신호 혼선 회피 시뮬레이션</h1>
    <div class="subtitle">독립적인 두 차량이 통신 없이 각자 무작위 지연(Random Delay)으로 혼선을 스스로 회피하는 가상 도로 환경</div>

    <div class="container">
        <div class="road-environment">
            <div class="crosstalk-alert" id="crosstalkAlert">⚠️ 신호 중첩 발생 (간섭 위험)!</div>
            
            <div class="car car-a" id="carA">
                <span>차량 A (앞차)</span>
                <span class="sensor-label">◀ 후방 초음파</span>
            </div>
            <div class="wave" id="waveA"></div>

            <div class="car car-b" id="carB">
                <span>차량 B (뒷차)</span>
                <span class="sensor-label">전방 초음파 ▶</span>
            </div>
            <div class="wave" id="waveB"></div>
        </div>

        <div class="panel">
            <div class="status-box" style="border-left: 4px solid var(--accent-blue);">
                <div class="status-title">차량 A (앞차) 발사 주기 <span id="delayA-text" style="color:var(--accent-blue)">대기 중</span></div>
                <div class="status-value" id="valA">-</div>
            </div>
            <div class="status-box" style="border-left: 4px solid var(--accent-green);">
                <div class="status-title">차량 B (뒷차) 발사 주기 <span id="delayB-text" style="color:var(--accent-green)">대기 중</span></div>
                <div class="status-value" id="valB">-</div>
            </div>
        </div>

        <div class="controls">
            <button id="btnStart" onclick="startSimulation()">시뮬레이션 시작</button>
            <button id="btnStop" class="stop" onclick="stopSimulation()">정지</button>
        </div>

        <div class="graph-container" id="graphContainer">
            <div class="graph-grid"></div>
            <div class="graph-line-desc">
                <div class="desc-item"><span style="background: var(--accent-blue);"></span>차량 A 주기</div>
                <div class="desc-item"><span style="background: var(--accent-green);"></span>차량 B 주기</div>
                <div class="desc-item"><span style="background: var(--accent-red);"></span>중첩(혼선 위치)</div>
            </div>
            </div>
    </div>

    <script>
        let isRunning = false;
        let timerA = null;
        let timerB = null;
        let graphTimer = null;
        let globalTime = 0;
        
        const waveA = document.getElementById('waveA');
        const waveB = document.getElementById('waveB');
        const alertBox = document.getElementById('crosstalkAlert');
        const graphContainer = document.getElementById('graphContainer');

        let lastA_Time = 0;
        let lastB_Time = 0;

        function startSimulation() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('btnStart').innerText = "시뮬레이션 진행 중...";
            
            globalTime = 0;
            // 그래프 리프레시용 타이머
            graphTimer = setInterval(() => {
                globalTime += 10;
                scrollGraph();
            }, 50);

            // 차량 A 루프 시작 (각자 독립적으로 구동됨)
            runVehicleA();
            // 차량 B 루프 시작
            runVehicleB();
        }

        function stopSimulation() {
            isRunning = false;
            clearTimeout(timerA);
            clearTimeout(timerB);
            clearInterval(graphTimer);
            document.getElementById('btnStart').innerText = "시뮬레이션 시작";
            document.getElementById('delayA-text').innerText = "정지됨";
            document.getElementById('delayB-text').innerText = "정지됨";
        }

        // 차량 A의 무작위 지연 제어 알고리즘 루프
        function runVehicleA() {
            if (!isRunning) return;

            // 1. 초음파 발사 및 애니메이션 트리거
            waveA.classList.remove('wave-a-active');
            void waveA.offsetWidth; // 리플로우 강제 유발 (애니메이션 리셋)
            waveA.classList.add('wave-a-active');
            
            lastA_Time = Date.now();
            checkCrosstalk();

            // 2. 난수 생성 (실제 도로 상황을 모사한 400ms ~ 900ms 사이의 완전한 무작위 변동 주기)
            let randomInterval = Math.floor(Math.random() * (900 - 400 + 1)) + 400;
            
            document.getElementById('valA').innerText = `Ping 발사! [지연: ${randomInterval}ms]`;
            document.getElementById('delayA-text').innerText = `주기 결정: ${randomInterval}ms`;
            drawDataPoint(randomInterval, 'var(--accent-blue)');

            // 3. 생성된 고유 난수만큼 쉬고 다음 초음파 발사
            timerA = setTimeout(runVehicleA, randomInterval);
        }

        // 차량 B의 무작위 지연 제어 알고리즘 루프
        function runVehicleB() {
            if (!isRunning) return;

            // 1. 초음파 발사 및 애니메이션 트리거
            waveB.classList.remove('wave-b-active');
            void waveB.offsetWidth;
            waveB.classList.add('wave-b-active');

            lastB_Time = Date.now();
            checkCrosstalk();

            // 2. 차량 B도 통신 없이 독자적인 난수 주기 생성
            let randomInterval = Math.floor(Math.random() * (900 - 400 + 1)) + 400;

            document.getElementById('valB').innerText = `Ping 발사! [지연: ${randomInterval}ms]`;
            document.getElementById('delayB-text').innerText = `주기 결정: ${randomInterval}ms`;
            drawDataPoint(randomInterval, 'var(--accent-green)');

            // 3. 독립적으로 다음 발사 대기
            timerB = setTimeout(runVehicleB, randomInterval);
        }

        // 두 차량의 신호가 우연히 완전히 겹쳤는지 판별하는 함수
        function checkCrosstalk() {
            let timeDiff = Math.abs(lastA_Time - lastB_Time);
            // 두 독립 차량의 발사 시차가 60ms 이내면 물리적 공간 안에서 파동이 중첩되어 혼선이 생겼다고 간주함
            if (timeDiff < 60) {
                alertBox.style.display = 'block';
                drawDataPoint(650, 'var(--accent-red)', true); // 혼선 발생 표시
                setTimeout(() => { alertBox.style.display = 'none'; }, 400);
            }
        }

        // 실시간 실측 그래프 드로잉 로직
        let dotElements = [];
        function drawDataPoint(intervalValue, color, isAlert = false) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.backgroundColor = color;
            
            // 값을 높이로 환산 (400~900ms 값을 그래프 높이 20~150px 로 매핑)
            let mappedHeight = ((intervalValue - 400) / 500) * 120 + 20;
            if (isAlert) {
                mappedHeight = 150;
                dot.style.width = '8px';
                dot.style.height = '8px';
                dot.style.zIndex = '10';
            }
            
            dot.style.bottom = `${mappedHeight}px`;
            dot.style.left = '980px'; // 우측 끝에서 시작
            
            graphContainer.appendChild(dot);
            dotElements.push({ element: dot, left: 980 });
        }

        // 그래프 좌측 스크롤 시뮬레이션
        function scrollGraph() {
            for (let i = dotElements.length - 1; i >= 0; i--) {
                dotElements[i].left -= 4;
                dotElements[i].element.style.left = `${dotElements[i].left}px`;
                
                // 화면 밖으로 나간 점들은 메모리 최적화를 위해 제거
                if (dotElements[i].left < 0) {
                    dotElements[i].element.remove();
                    dotElements.splice(i, 1);
                }
            }
        }
    </script>
</body>
</html>
